name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versão (patch = correção, minor = novidade, major = mudança grande)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Nova versão
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "prev=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "tag=$(npm version ${{ inputs.bump }} -m 'chore(release): %s')" >> "$GITHUB_OUTPUT"

      - run: npm run db:migrate:remote
      - run: npm run deploy

      - run: git push --follow-tags

      - name: Release
        run: |
          bash .github/scripts/release-notes.sh "${{ steps.version.outputs.prev }}" > notes.md
          gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md --generate-notes \
            ${{ steps.version.outputs.prev && format('--notes-start-tag {0}', steps.version.outputs.prev) || '' }}
